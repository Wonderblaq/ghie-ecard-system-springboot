services:
  db:
    image: postgres:15-alpine
    container_name: ghie-postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # Added Volume

  app:
    build: .
    container_name: ghie-backend
    env_file:
      - .env
    ports:
      - "8080:10000"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - FASTAPI_URL=http://fastapi-service:8000

  fastapi-service:
    build: ./ghie-card-service
    container_name: python-card-service
    env_file:
      - .env
    ports:
      - "8000:8000"

# Root-level declaration tells Docker to initialize this named volume space
volumes:
  pgdata: