spring.application.name=GhIE-ecard
server.address = 0.0.0.0
server.port=8080

spring.jackson.default-property-inclusion=NON_NULL

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.threads.virtual.enabled=true


spring.web.error.include-message=always
spring.web.error.include-stacktrace=always


# 1. The name and location of the log file
logging.file.name=logs/ghie-ecard.log


# 2. Control how much detail you want to see (Level)
logging.level.root=INFO
logging.level.com.registrations.GhIE_ecard=DEBUG

# 3. Archive logs so the file doesn't grow forever (Rotation)
# Keep logs for 7 days
logging.logback.rollingpolicy.max-history=7
# Start a new file once it reaches 10MB
logging.logback.rollingpolicy.max-file-size=10MB

# Local development default
api.fastapi.base-url=${FASTAPI_URL:http://fastapi-service:8000}

jwt.secret=${SECRET_KEY}
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=969923002@smtp-brevo.com
mail.sender=Admin@yeghie.com
spring.mail.password=${SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Enable multipart uploads
spring.servlet.multipart.enabled=true

# Set max size per file (e.g., 10MB)
spring.servlet.multipart.max-file-size=10MB

# Set max size per request
spring.servlet.multipart.max-request-size=10MB




